name = "mochilog-web"
# Set compatibility_date to a past date to avoid Cloudflare API "future date" validation error.
# If you deploy on a different day, update this to today's date (not in the future).
compatibility_date = "2026-01-03"
compatibility_flags = ["nodejs_compat"]
main = "src/index.tsx"

# 静的ファイル配信（OGP画像など）
[assets]
directory = "public"

[observability]
enabled = true

